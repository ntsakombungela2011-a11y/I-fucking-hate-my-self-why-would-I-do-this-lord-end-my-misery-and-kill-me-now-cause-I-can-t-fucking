name: Tests

on:
  push:
    paths:
      - 'lib/**'
      - '!lib/l10n/**'
      - 'test/**'
      - 'pubspec.yaml'
    branches:
      - main
  pull_request:
    paths:
      - 'lib/**'
      - '!lib/l10n/**'
      - 'test/**'
      - 'pubspec.yaml'
    branches:
      - main

# Declare default permissions as read only.
permissions: read-all

jobs:
  unit-test:
    name: Unit tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6.0.3

      - name: 🐦 Install flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install requirements for sqflite_common_ffi package
        run: sudo apt-get -y install libsqlite3-0 libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build

      - name: Verify formatting
        run: |
          git fetch origin main --depth=1 || true
          MODIFIED_FILES=$(git diff --name-only origin/main...HEAD | grep '\.dart$' | grep -v '\.freezed\.dart$' | grep -v '\.g\.dart$' | grep -v 'lichess_icons\.dart$' || true)
          if [ -n "$MODIFIED_FILES" ]; then
            echo "Checking formatting of modified files: $MODIFIED_FILES"
            dart format --output=none --set-exit-if-changed $MODIFIED_FILES
          else
            echo "No modified Dart files to check."
          fi
        # run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      # - name: Run riverpod lint
      #   run: dart run custom_lint

      - name: Run unit tests
        run: flutter test

